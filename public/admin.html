<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Vaultra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { ink:'#0B0F14', panel:'#111823', line:'#1E2937', mint:'#3DDC97', mint2:'#22B27A', gold:'#E8C46A' },
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
        boxShadow: { glow: '0 0 40px -10px rgba(61,220,151,0.45)' }
      } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-ink text-slate-200 min-h-screen">

<header class="border-b border-white/5 bg-ink/60 backdrop-blur sticky top-0 z-30">
  <nav class="max-w-7xl mx-auto px-5 sm:px-8 h-16 flex items-center justify-between">
    <a href="/index.html" class="flex items-center gap-2 hover:scale-[1.02] transition-transform">
      <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-mint to-mint2 grid place-items-center shadow-glow">
        <i class="fa-solid fa-vault text-[#062015] text-sm"></i>
      </span>
      <span class="text-white font-semibold tracking-tight text-lg">Vaultra <span class="text-gold text-xs ml-1">ADMIN</span></span>
    </a>
    <div class="flex items-center gap-3">
      <a href="/dashboard.html" class="text-sm text-slate-400 hover:text-white min-h-[44px] flex items-center">Dashboard</a>
      <button data-logout class="btn-ghost !py-2 !px-4 text-sm min-h-[44px]">Logout</button>
    </div>
  </nav>
</header>

<main id="adminRoot" class="max-w-7xl mx-auto px-5 sm:px-8 py-8 page-enter">
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8 card-grid stagger">
    <div class="card">
      <div class="flex items-center justify-between">
        <span class="text-xs uppercase tracking-wider text-slate-500">Users</span>
        <i class="fa-solid fa-users text-mint"></i>
      </div>
      <div class="text-2xl font-semibold text-white mt-3" data-stat="users">—</div>
    </div>
    <div class="card">
      <div class="flex items-center justify-between">
        <span class="text-xs uppercase tracking-wider text-slate-500">Plans</span>
        <i class="fa-solid fa-layer-group text-mint"></i>
      </div>
      <div class="text-2xl font-semibold text-white mt-3" data-stat="plans">—</div>
    </div>
    <div class="card">
      <div class="flex items-center justify-between">
        <span class="text-xs uppercase tracking-wider text-slate-500">Referrals</span>
        <i class="fa-solid fa-user-group text-mint"></i>
      </div>
      <div class="text-2xl font-semibold text-white mt-3" data-stat="referrals">—</div>
    </div>
  </div>

  <div class="card mb-8 reveal">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-4">
      <h2 class="text-white font-semibold">Users</h2>
      <input id="userSearch" class="input sm:max-w-xs min-h-[48px]" placeholder="Search by name or email..." />
    </div>
    <div id="usersTable" class="table-wrapper"></div>
  </div>

  <div class="card mb-8 reveal">
    <h2 class="text-white font-semibold mb-4">Plans</h2>
    <div id="plansTable" class="table-wrapper"></div>
  </div>

  <div class="card reveal">
    <h2 class="text-white font-semibold mb-4">Recent platform activity</h2>
    <div id="adminActivity"></div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
