<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — Vaultra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { ink:'#0B0F14', panel:'#111823', line:'#1E2937', mint:'#3DDC97', mint2:'#22B27A', gold:'#E8C46A' },
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
        boxShadow: { glow: '0 0 40px -10px rgba(61,220,151,0.45)' }
      } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-ink text-slate-200 min-h-screen">

<div class="flex min-h-screen">
  <aside class="desktop-sidebar hidden lg:flex w-64 flex-col border-r border-white/5 bg-panel/40 p-5">
    <a href="/index.html" class="flex items-center gap-2 mb-10 hover:scale-[1.02] transition-transform">
      <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-mint to-mint2 grid place-items-center shadow-glow">
        <i class="fa-solid fa-vault text-[#062015] text-sm"></i>
      </span>
      <span class="text-white font-semibold tracking-tight text-lg">Vaultra</span>
    </a>
    <nav class="flex-1 space-y-1 stagger">
      <a href="/dashboard.html" class="sidebar-link"><i class="fa-solid fa-house w-4"></i> Overview</a>
      <a href="/plans.html" class="sidebar-link"><i class="fa-solid fa-layer-group w-4"></i> Plans</a>
      <a href="/referrals.html" class="sidebar-link"><i class="fa-solid fa-user-group w-4"></i> Referrals</a>
      <a href="/notifications.html" class="sidebar-link active"><i class="fa-solid fa-bell w-4"></i> Notifications</a>
      <a href="/profile.html" class="sidebar-link"><i class="fa-solid fa-user w-4"></i> Profile</a>
      <a href="/settings.html" class="sidebar-link"><i class="fa-solid fa-gear w-4"></i> Settings</a>
      <a href="/support.html" class="sidebar-link"><i class="fa-solid fa-life-ring w-4"></i> Support</a>
    </nav>
    <div class="mt-6 pt-6 border-t border-white/5">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-9 h-9 rounded-full bg-mint/15 grid place-items-center text-mint font-semibold" data-user-initial>U</div>
        <div class="flex-1 min-w-0">
          <div class="text-sm text-white truncate" data-user-name>—</div>
          <div class="text-xs text-slate-500 truncate" data-user-email>—</div>
        </div>
      </div>
      <button data-logout class="sidebar-link w-full text-left text-rose-300 hover:text-rose-200 min-h-[44px]">
        <i class="fa-solid fa-arrow-right-from-bracket w-4"></i> Log out
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col">
    <header class="border-b border-white/5 bg-ink/60 backdrop-blur sticky top-0 z-30">
      <div class="px-5 sm:px-8 h-16 flex items-center justify-between">
        <h1 class="text-white font-semibold">Notifications</h1>
        <a href="/dashboard.html" class="text-xs text-slate-400 hover:text-white">
          <i class="fa-solid fa-arrow-left mr-2"></i> Back
        </a>
      </div>
    </header>

    <main class="flex-1 px-5 sm:px-8 py-8 max-w-3xl mx-auto w-full page-enter">
      <div id="notifList" class="space-y-3 stagger"></div>
    </main>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
